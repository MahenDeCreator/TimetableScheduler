{% extends 'base.html' %}
{% block content %}
{% load static %}




<fieldset class="fieldset">
  <div class="tablink">
    <a href="{% url 'classroom_add'%}">
      <h1 onclick="openPage('new')" id="defaultOpen">Add Classroom</h1>
    </a>
    <h1 onclick="openPage('edit')" id="link_to_edit">Edit Classrooms</h1>
  </div>
  <div class="tabcontent" id="edit">
    <table class="editTable">
      <thead>
        <tr class="table-headers">
          <th>Room No.</th>
          <th>Seating Capacity</th>
          <th class="empty"></th>
        </tr>
      </thead>

      <tbody>
        {% for classroom in classrooms %}
        <tr>
          <td>{{ classroom.room_code }}</td>
          <td>{{ classroom.capacity }}</td>
          <td class="empty">
            <form action="{% url 'delete_classroom' classroom.pk %}" method="post">
              {% csrf_token %}
              <input type="submit" value="X" class="cross">
            </form>
          </td>
        </tr>
        {% empty %}
        <tr>
          <td colspan="3">No classrooms found.</td>
        </tr>
        {% endfor %}
      </tbody>

    </table>
  </div>
</fieldset>

{% endblock %}
