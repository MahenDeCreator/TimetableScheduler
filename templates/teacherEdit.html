{% extends 'base.html' %}
{% block content %}
{% load static %}




<fieldset class="fieldset">
  <div class="tablink">
    <a href="{% url 'teacher_add'%}">
      <h1 onclick="openPage('new')" id="defaultOpen">Add Teacher</h1>
    </a>
    <h1 onclick="openPage('edit')" id="link_to_edit">Edit Teacher</h1>
  </div>
  <div class="tabcontent" id="edit">
    <table class="editTable">
      <thead>
        <tr class="table-headers">
          <th>UID</th>
          <th>Name</th>
          <th class="empty"></th>
        </tr>
      </thead>

      <tbody>
        {% for teacher in teachers %}
        <tr>
          <td>{{ teacher.teacher_id }}</td>
          <td>{{ teacher.full_name }}</td>
          <td class="empty">
            <form action="{% url 'delete_teacher' teacher.pk %}" method="post">
              {% csrf_token %}
              <input type="submit" value="X" class="cross">
            </form>
          </td>
        </tr>
        {% empty %}
        <tr>
          <td colspan="3">No teachers found.</td>
        </tr>
        {% endfor %}
      </tbody>

    </table>
  </div>
</fieldset>

{% endblock %}
