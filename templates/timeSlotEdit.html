{% extends 'base.html' %}
{% block content %}
{% load static %}




<fieldset class="fieldset">
  <div class="tablink">
    <a href="{% url 'time_slot_add'%}">
      <h1 onclick="openPage('new')" id="defaultOpen">Add Time Slot</h1>
    </a>
    <h1 onclick="openPage('edit')" id="link_to_edit">Edit Time Slot</h1>
  </div>
  <div class="tabcontent" id="edit">
    <table class="editTable">
      <thead>
        <tr class="table-headers">
          <th>PID</th>
          <th>Day</th>
          <th>Timing</th>
          <th class="empty"></th>
        </tr>
      </thead>

      <tbody>
        {% for time_slot in time_slots %}
        <tr>
          <td>{{ time_slot.slot_id }}</td>
          <td>{{ time_slot.weekday }}</td>
          <td>{{ time_slot.duration }}</td>
          <td class="empty">
            <form action="{% url 'delete_time_slot' time_slot.pk %}" method="post">
              {% csrf_token %}
              <input type="submit" value="X" class="cross">
            </form>
          </td>
        </tr>
        {% empty %}
        <tr>
          <td colspan="4">No time slots found.</td>
        </tr>
        {% endfor %}
      </tbody>

    </table>
  </div>
</fieldset>

{% endblock %}
